<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>TCG Image Tool</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>TCG Image Tool</h1>
      <p>Sube las imágenes de tus cartas (front y back en pares).</p>

      <input type="file" id="files" multiple accept="image/*" />

      <button id="startBtn">Procesar cartas</button>

      <div class="progress-container">
        <progress id="progress" value="0" max="100"></progress>
        <span id="percent">0%</span>
      </div>

      <a id="download" style="display: none">Descargar resultados</a>

      <pre id="log"></pre>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
