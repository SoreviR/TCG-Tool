<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TCG Image Tool</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <button id="menuToggle" class="menu-toggle">☰</button>

    <nav id="binder" class="binder">
      <div class="binder-logo">TCG Tool</div>

      <ul>
        <li class="active" data-i18n="nav_tool">Tool</li>
        <li data-i18n="nav_about">About</li>
      </ul>

      <div class="binder-controls">
        <button id="langToggle">ES</button>
        <button id="themeToggle">☀️</button>
      </div>
    </nav>

    <main class="content">
      <div class="tool-card">
        <h1 data-i18n="title">TCG Image Processor</h1>
        <p data-i18n="description">
          Upload card photos in pairs (front/back). A 5mm border will be cropped
          automatically.
        </p>

        <div id="dropzone" class="dropzone">
          <p data-i18n="dropzone">Drag & drop images here or click to select</p>
          <input type="file" id="files" multiple accept="image/*" hidden />
        </div>

        <div id="preview" class="preview"></div>

        <button id="startBtn" data-i18n="process">Process cards</button>
        <button id="resetBtn" class="reset" data-i18n="reset">Reset</button>

        <a
          id="download"
          class="download"
          style="display: none"
          data-i18n="download"
        >
          Download results
        </a>
      </div>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
