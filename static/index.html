<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>TCG Image Tool</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="app">
      <div class="card">
        <h1>TCG Image Tool</h1>
        <p class="subtitle">
          Herramienta web para preparar imágenes de cartas listas para
          Cardmarket.
        </p>

        <ul class="info">
          <li>📸 Sube imágenes en pares (front y back)</li>
          <li>✂️ Se recorta automáticamente ~5mm del marco</li>
          <li>🖼️ El front siempre queda a la izquierda</li>
          <li>📦 Máx. 10 cartas por proceso</li>
        </ul>

        <div class="upload">
          <input type="file" id="files" multiple accept="image/*" />
        </div>

        <button id="startBtn">Procesar cartas</button>

        <div class="progress-wrapper">
          <div class="progress-bar">
            <div id="progressFill"></div>
          </div>
          <span id="progressText">0%</span>
        </div>

        <a id="download" class="download" style="display: none">
          Descargar resultados (ZIP)
        </a>

        <div id="log" class="log"></div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
