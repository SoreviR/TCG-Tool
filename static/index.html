<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>TCG Binder Tool</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="background-cards"></div>

    <nav class="binder">
      <div class="binder-logo">TCG Binder</div>
      <ul>
        <li class="active">Procesar</li>
        <li>Cómo funciona</li>
        <li>Perfil TCG</li>
        <li>Acerca</li>
      </ul>
    </nav>

    <main class="content">
      <section class="tool-card">
        <header>
          <h1>Preparar cartas para Cardmarket</h1>
          <p>
            Sube tus fotos, nosotros hacemos el resto.<br />
            Diseñado para coleccionistas.
          </p>
        </header>

        <div class="tcg-selector">
          <label>Tipo de cartas</label>
          <select id="tcg">
            <option value="generic">Automático</option>
            <option value="pokemon">Pokémon</option>
            <option value="mtg">Magic: The Gathering</option>
            <option value="yugioh">Yu-Gi-Oh!</option>
          </select>
        </div>

        <div id="dropzone" class="dropzone">
          <p>
            Arrastra aquí tus imágenes<br />
            <span>Pares: Front + Back</span>
          </p>
          <input type="file" id="files" multiple accept="image/*" />
        </div>

        <div id="preview" class="preview"></div>

        <button id="startBtn">Procesar cartas</button>

        <div class="progress-wrapper">
          <div class="progress-bar">
            <div id="progressFill"></div>
          </div>
          <span id="progressText">0%</span>
        </div>

        <a id="download" class="download" style="display: none">
          Descargar imágenes
        </a>

        <div id="log" class="log"></div>
      </section>
    </main>

    <footer>Hecho para coleccionistas · TCG Binder Tool</footer>

    <script src="/static/app.js"></script>
  </body>
</html>
