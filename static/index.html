<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TCG Image Tool</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <button id="menuToggle" class="menu-toggle" type="button">
      <span class="hamburger">
        <span class="bar bar1"></span>
        <span class="bar bar2"></span>
        <span class="bar bar3"></span>
      </span>
    </button>

    <nav id="navbar" class="navbar">
      <h2>TCG Tool</h2>
      <div class="navbar-actions">
        <button id="langBtn" class="square-btn">ES</button>
        <button id="themeBtn" class="square-btn">☀️</button>
      </div>
    </nav>

    <div class="page">
      <main class="content">
        <h1 data-i18n="title">TCG Image Processor</h1>

        <p data-i18n="desc">Upload card images in pairs (front/back).</p>

        <div id="dropzone" class="dropzone">
          <span data-i18n="drop">Drag & drop images or click here</span>
          <input type="file" id="files" multiple accept="image/*" hidden />
        </div>

        <div id="preview" class="preview"></div>

        <!-- PROGRESS -->
        <div class="progress-wrapper">
          <div class="progress-container">
            <div id="progressBar"></div>
          </div>
          <span id="progressText">0%</span>
        </div>

        <div class="actions">
          <button id="processBtn" class="primary-btn">Process</button>
          <button id="resetBtn" class="secondary-btn">Reset</button>
        </div>

        <a id="download" class="download-link" style="display: none">
          Download
        </a>
      </main>
    </div>

    <!-- FEEDBACK -->
    <button id="feedbackBtn" class="feedback-btn">Feedback</button>

    <div id="feedbackModal" class="modal">
      <div class="modal-content">
        <h3>Feedback</h3>

        <select id="fbCategory">
          <option value="">Select category</option>
          <option value="bug">Bug</option>
          <option value="idea">Idea / Feature</option>
          <option value="general">General</option>
        </select>

        <textarea id="fbMessage" placeholder="Your feedback..."></textarea>
        <input id="fbEmail" type="email" placeholder="Email (optional)" />

        <div id="fbStatus" class="feedback-status"></div>

        <div class="modal-actions">
          <button id="sendFeedback" class="primary-btn">Send</button>
          <button id="closeFeedback" class="secondary-btn">Cancel</button>
        </div>
      </div>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
