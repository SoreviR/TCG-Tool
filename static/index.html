<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TCG Image Tool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <!-- PEGAR ANTES DE </body> -->

  <button id="feedbackBtn" class="feedback-btn">💬</button>

  <div id="feedbackModal" class="modal">
    <div class="modal-content">
      <h3 data-i18n="feedback_title">Feedback</h3>

      <textarea id="fbMessage" placeholder="Your feedback..."></textarea>

      <input id="fbEmail" type="email" placeholder="Email (optional)" />

      <div id="fbStatus" class="feedback-status"></div>

      <div class="modal-actions">
        <button id="sendFeedback" class="primary-btn" data-i18n="send">
          Send
        </button>
        <button id="closeFeedback" class="secondary-btn">Cancel</button>
      </div>
    </div>
  </div>

  <body>
    <!-- BOTÓN MENU -->
    <button
      id="menuToggle"
      class="menu-toggle"
      aria-label="Open menu"
      aria-expanded="false"
      type="button"
    >
      <span class="hamburger" aria-hidden="true">
        <span class="bar bar1"></span>
        <span class="bar bar2"></span>
        <span class="bar bar3"></span>
      </span>
    </button>

    <!-- NAVBAR -->
    <nav id="navbar" class="navbar">
      <h2>TCG Tool</h2>
      <div class="navbar-actions">
        <button id="langBtn" class="square-btn">ES</button>
        <button id="themeBtn" class="square-btn">☀️</button>
      </div>
    </nav>

    <!-- CONTENIDO -->
    <div class="page">
      <main class="content">
        <h1 data-i18n="title">TCG Image Processor</h1>

        <p data-i18n="desc">
          Upload card images in pairs (front/back). A 5mm border will be
          cropped.
        </p>

        <div id="dropzone" class="dropzone">
          <span data-i18n="drop">Drag & drop images or click here</span>
          <input type="file" id="files" multiple accept="image/*" hidden />
        </div>

        <div id="preview" class="preview"></div>

        <!-- PROGRESS -->
        <div class="progress-wrapper">
          <div class="progress-container">
            <div id="progressBar"></div>
          </div>
          <div id="progressText" class="progress-text">0%</div>
        </div>

        <div class="actions">
          <button id="processBtn" class="primary-btn" data-i18n="process">
            Process
          </button>
          <button id="resetBtn" class="secondary-btn">Reset</button>
        </div>

        <a
          id="download"
          class="download-link"
          style="display: none"
          data-i18n="download"
        >
          Download
        </a>
      </main>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
