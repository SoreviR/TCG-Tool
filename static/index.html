<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TCG Image Tool</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <!-- BOTÓN MENU (Animated Hamburger) -->
    <button
      id="menuToggle"
      class="menu-toggle"
      aria-label="Open menu"
      aria-expanded="false"
      type="button"
    >
      <!-- Closed book -->
      <svg
        class="icon-book icon-closed"
        viewBox="0 0 64 64"
        aria-hidden="true"
        focusable="false"
      >
        <rect x="10" y="12" width="36" height="40" rx="3" class="cover" />
        <rect x="8" y="12" width="8" height="40" rx="2" class="spine" />
      </svg>

      <!-- Open book -->
      <svg
        class="icon-book icon-open"
        viewBox="0 0 64 64"
        aria-hidden="true"
        focusable="false"
      >
        <path class="page-left" d="M8 12 C20 18, 28 46, 32 52 L32 12 Z" />
        <path class="page-right" d="M56 12 C44 18, 36 46, 32 52 L32 12 Z" />
        <rect x="28" y="22" width="8" height="20" class="spine-open" rx="1" />
      </svg>
    </button>

    <!-- NAVBAR -->
    <nav id="navbar" class="navbar">
      <h2>TCG Tool</h2>
      <div class="navbar-actions">
        <button id="langBtn" class="square-btn" aria-label="Toggle language">
          ES
        </button>
        <button id="themeBtn" class="square-btn" aria-label="Toggle theme">
          ☀️
        </button>
      </div>
    </nav>

    <!-- CONTENIDO -->
    <div class="page">
      <main class="content">
        <h1 data-i18n="title">TCG Image Processor</h1>

        <p data-i18n="desc">
          Upload card images in pairs (front/back). A 5mm border will be
          cropped.
        </p>

        <div id="dropzone" class="dropzone">
          <span data-i18n="drop">Drag & drop images or click here</span>
          <input type="file" id="files" multiple accept="image/*" hidden />
        </div>

        <div id="preview" class="preview"></div>

        <div class="progress-container">
          <div id="progressBar"></div>
        </div>

        <button id="processBtn" class="primary-btn" data-i18n="process">
          Process
        </button>

        <a
          id="download"
          class="download-link"
          style="display: none"
          data-i18n="download"
        >
          Download
        </a>
      </main>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
