<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TCG Image Tool</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>

  <body>
    <!-- MENU BUTTON -->
    <button id="menuToggle" class="menu-toggle" type="button">
      <span class="hamburger">
        <span class="bar bar1"></span>
        <span class="bar bar2"></span>
        <span class="bar bar3"></span>
      </span>
    </button>

    <!-- NAVBAR -->
    <nav id="navbar" class="navbar">
      <h2>TCG Tool</h2>
      <div class="navbar-actions">
        <button id="langBtn" class="square-btn">ES</button>
        <button id="themeBtn" class="square-btn">☀️</button>
      </div>
    </nav>

    <!-- MAIN -->
    <div class="page">
      <main class="content">
        <h1 data-i18n="title">TCG Image Processor</h1>
        <p data-i18n="desc">Upload card images in pairs (front/back).</p>

        <div id="dropzone" class="dropzone">
          <span data-i18n="drop">Drag & drop images or click here</span>
          <input type="file" id="files" multiple accept="image/*" hidden />
        </div>

        <div id="preview" class="preview"></div>

        <div class="progress-wrapper">
          <div class="progress-container">
            <div id="progressBar"></div>
          </div>
          <span id="progressText">0%</span>
        </div>

        <div class="actions">
          <button id="processBtn" class="primary-btn" data-i18n="process">
            Process
          </button>
          <button id="resetBtn" class="secondary-btn">Reset</button>
        </div>

        <a
          id="download"
          class="download-link"
          style="display: none"
          data-i18n="download"
        >
          Download
        </a>
      </main>
    </div>

    <!-- FEEDBACK FLOATING BUTTON -->
    <button id="feedbackBtn" class="feedback-btn" data-i18n="feedback">
      Feedback
    </button>

    <!-- FEEDBACK MODAL -->
    <div id="feedbackModal" class="modal">
      <div class="modal-content">
        <button id="closeFeedback" class="modal-close" type="button">✕</button>

        <h3 data-i18n="feedbackTitle">Tu opinión nos ayuda</h3>

        <form id="feedbackForm">
          <!-- CATEGORY -->
          <select name="category">
            <option value="">Select category</option>
            <option value="bug">Bug</option>
            <option value="idea">Idea / Feature</option>
            <option value="general">General</option>
          </select>

          <!-- NAME -->
          <input type="text" name="name" placeholder="Name (optional)" />

          <!-- EMAIL (OPTIONAL) -->
          <input type="email" name="email" placeholder="Email (optional)" />

          <!-- MESSAGE -->
          <textarea
            name="message"
            placeholder="Your feedback..."
            required
          ></textarea>

          <button type="submit" class="primary-btn" data-i18n="feedbackSend">
            Send
          </button>
        </form>
      </div>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
